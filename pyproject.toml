[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slmemulator"
authors = [
    {name = "Sudhanva Lalit"},
    {name = "Alexandra Semposki"},
    {name = "Joshua Maldonado"},
]
description = "SLM is a python package for star log-extended emulation. It is based on DMD."
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "h5py",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]", "mkdocs-jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"slmemulator" = ["EOS_Data/*", "EOS_Codes/*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/asemposki/SLM"
Documentation = "https://slm.readthedocs.io/en/latest/"
Issues = "https://github.com/asemposki/SLM/issues"
